name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python
        run: python -m py_compile traktor-system-controller.py traktor-controller.py traktor_controller/*.py
      - name: Validate configuration
        run: |
          for file in config.default.json config.example.json config.blank.json defaults/*.json; do
            python -m json.tool "$file" >/dev/null
          done
          TRAKTOR_CONTROLLER_BACKEND=$PWD/traktor-system-controller.py python traktor-controller.py --config config.default.json --validate-config
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell
        run: bash -n install.sh helpers/system-actions examples/model-controls-updated
      - name: Validate SVG assets
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('assets').glob('*.svg'):
              ET.parse(path)
          PY
      - name: Install Tk workflow requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install pillow
      - name: Exercise real Tk workflow without hardware
        run: xvfb-run -a -s "-screen 0 1280x900x24" python tests/tk_workflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MIDILIN-tk-quality
          path: artifacts/tk-quality
          if-no-files-found: warn
